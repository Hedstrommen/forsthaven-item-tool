<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Makes the app usable on phones: scales to the screen width -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frosthaven Item Tool</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top navigation: three pages plus a save button -->
  <nav class="topnav">
    <div class="brand">Frosthaven Items</div>
    <div class="navlinks">
      <button data-nav="browse" class="navlink">All Items</button>
      <button data-nav="pool" class="navlink">My Items</button>
      <button data-nav="builds" class="navlink active">Builds</button>
      <button id="save-load-button" class="navlink">Save / Load</button>
    </div>
  </nav>

  <main id="app"></main>

  <!-- Detail overlay: one item's full information -->
  <div id="detail-overlay" class="overlay hidden">
    <div class="overlay-content" id="detail-content"></div>
  </div>

  <!-- Save / load overlay -->
  <div id="save-overlay" class="overlay hidden">
    <div class="overlay-content">
      <h2>Save / Load</h2>
      <p>Your data is saved automatically in this browser. Use the buttons below to keep a backup file or restore one.</p>
      <button id="export-button">Download backup file</button>
      <label class="import-label">Restore from backup file
        <input type="file" id="import-input" accept="application/json" />
      </label>
      <p id="import-status" class="status-text"></p>
      <button class="close-overlay">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
