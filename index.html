<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frosthaven Item Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
  <meta name="theme-color" content="#0d1a26" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FH Items" />
</head>
<body>
  <div class="app-shell">
    <nav id="sidebar">
      <div class="brand">
        <span class="brand-title">Frosthaven</span>
        <span class="brand-sub">Item Tool</span>
      </div>
      <div id="game-toggle" class="game-toggle"></div>
      <div class="side-nav">
        <button data-nav="browse" class="navlink active">All Items</button>
        <button data-nav="campaigns" class="navlink">My Campaigns</button>
        <button id="save-load-button" class="navlink">Save / Load</button>
      </div>
      <div class="builds-heading">
        <h2>My Builds</h2>
      </div>
      <button id="new-build-button" class="new-build-button">
        <span class="plus-mark">+</span> New build
      </button>
      <div id="sidebar-builds" class="sidebar-builds"></div>
      <div class="builds-heading campaigns-heading">
        <h2>My Campaigns</h2>
      </div>
      <button id="new-campaign-button" class="new-campaign-button">
        <span class="plus-mark">+</span> New campaign
      </button>
      <div id="sidebar-campaigns" class="sidebar-builds"></div>
    </nav>

    <main id="app"></main>
  </div>

  <div id="detail-overlay" class="overlay hidden">
    <div class="overlay-content" id="detail-content"></div>
  </div>

  <div id="save-overlay" class="overlay hidden">
    <div class="overlay-content">
      <h2>Save / Load</h2>
      <p>Your data is saved automatically in this browser. Use the buttons below to keep a backup file or restore one.</p>
      <button id="export-button">Download backup file</button>
      <label class="import-label">Restore from backup file
        <input type="file" id="import-input" accept="application/json" />
      </label>
      <p id="import-status" class="status-text"></p>
      <button class="close-overlay">Close</button>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  </script>
  <script src="game-data.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
